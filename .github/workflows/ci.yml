name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    # Playwright 1.56.1 supports 24.04; ubuntu-latest moved to 26.04.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 20.19.0
      # npm 10.8.2 crashes in Arborist (edgesOut) on the optional-peer graph.
      # Match the npm version used by the validated local kit/bootstrap build.
      - run: npm install --global npm@11.9.0
      - run: npm install --no-audit --no-fund
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npm run pack:check
      - run: npm run bootstrap:check
      - run: npm run bootstrap:smoke
      - run: npx playwright install --with-deps chromium
      - run: npm run test:browser
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: road-lines-browser-evidence
          path: .test-output/road-lines
          if-no-files-found: ignore
